version: 2
models:
  - name: orders_header_silver
    config:
      contract:
        enforced: true
      description: "orders header table"
    columns: 
      - name: order_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests: [not_null, unique]
      - name: order_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]
      - name: date
        data_type: date
        constraints:
          - type: not_null
        tests: [not_null]
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests: [not_null, unique]
      - name: channel
        data_type: bigint
        constraints:
          - type: not_null
        tests: [not_null]
      - name: payment_method
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: coupon_code
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: channel_1
        data_type: bigint
        constraints:
          - type: not_null
        tests: [not_null]
      - name: currency
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: isDeleted
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: ingestion_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]
      - name: src_filename
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: src_hash
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]

   