version: 2
models:
  - name: returns_silver
    config:
      contract:
        enforced: true
      description: "returns table"
    columns: 
      - name: return_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests: [not_null, unique]
      - name: order_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests: [not_null, unique]
      - name: product_id
        data_type: bigint
        constraints:
          - type: not_null
          - type: unique
        tests: [not_null, unique]
      - name: return_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]
      - name: qty
        data_type: bigint
        constraints:
          - type: not_null
        tests: [not_null]
      - name: reason
        data_type: string
        constraints:
          - type: not_null
        tests: 
         - not_null
         - accepted_values:        
              arguments:     
                values: ['Quality Issues','Reason Not Specified','Factory Defect','Not Satisfied']        
      - name: isDeleted
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: ingestion_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]
      - name: src_filename
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: src_hash
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]


   