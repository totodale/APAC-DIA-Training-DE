version: 2
models:
  - name: customers_silver
    config:
      contract:
        enforced: true
      description: "customer table"
    columns: 
      - name: customer_id
        data_type: bigint
        constraints:
          - type: not_null
        tests: [not_null, unique]
      - name: natural_key
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: first_name
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: last_name
        data_type: string  
        constraints:
          - type: not_null
        tests: [not_null]
      - name: full_name
        data_type: varchar
        constraints:
          - type: not_null
        tests: [not_null]
      - name: email
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: phone
        data_type: string 
        constraints:
          - type: not_null
        tests: [not_null]
      - name: address_line1
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: address_line2
        data_type: string  
      - name: city
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: state_region
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: postcode
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]        
      - name: country_code
        data_type: string
        constraints:
          - type: not_null
        tests: [not_null]
      - name: latitude 
        data_type: double
        constraints:
          - type: not_null
        tests: [not_null]
      - name: longitude
        data_type: double
        constraints:
          - type: not_null
        tests: [not_null]
      - name: birth_date
        data_type: date
        constraints:
          - type: not_null 
        tests: [not_null]
      - name: join_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]
      - name: is_vip
        constraints:
          - type: not_null
        data_type: boolean
        tests: [not_null]
      - name: gdpr_consent
        data_type: boolean
        constraints:
          - type: not_null
        tests: [not_null]
      - name: ingestion_ts
        data_type: timestamp
        constraints:
          - type: not_null
        tests: [not_null]

   